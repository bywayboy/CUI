<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">UiRingProgress 圆形进度条视觉稿</title>
  <desc id="desc">三个状态：带百分号与标题、带数值单位与标题、无标题。圆环从 12 点顺时针绘制，圆角端点。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D2B4D" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="560" rx="28" fill="#F5F7FB"/>
  <text x="48" y="52" fill="#17233C" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" font-weight="700">UiRingProgress · 圆形进度条</text>
  <text x="48" y="80" fill="#72809A" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">圆环从 12 点顺时针 · 圆角端点 · 中央数值 / 单位 · 可选底部标题</text>

  <!-- 带标题 · 百分比 -->
  <g filter="url(#shadow)">
    <rect x="40" y="108" width="312" height="396" rx="22" fill="#FFFFFF" stroke="#E8ECF4"/>
  </g>
  <text x="68" y="142" fill="#8A96AA" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">带标题 · 百分比</text>
  <circle cx="196" cy="282" r="92" fill="none" stroke="#E8ECF4" stroke-width="18"/>
  <circle cx="196" cy="282" r="92" fill="none" stroke="#4F6FF3" stroke-width="18" stroke-linecap="round" stroke-dasharray="434.294 603.186" transform="rotate(-90 196 282)"/>
  <text x="196" y="290" text-anchor="middle" fill="#17233C" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="58" font-weight="650">72</text>
  <text x="196" y="316" text-anchor="middle" fill="#72809A" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="500">%</text>
  <text x="196" y="424" text-anchor="middle" fill="#34415C" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600">本月完成度</text>

  <!-- 带标题 · 数值单位 -->
  <g filter="url(#shadow)">
    <rect x="384" y="108" width="312" height="396" rx="22" fill="#FFFFFF" stroke="#E8ECF4"/>
  </g>
  <text x="412" y="142" fill="#8A96AA" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">带标题 · 数值单位</text>
  <circle cx="540" cy="282" r="92" fill="none" stroke="#E8ECF4" stroke-width="18"/>
  <circle cx="540" cy="282" r="92" fill="none" stroke="#4F6FF3" stroke-width="18" stroke-linecap="round" stroke-dasharray="412.579 603.186" transform="rotate(-90 540 282)"/>
  <text x="540" y="290" text-anchor="middle" fill="#17233C" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="58" font-weight="650">68.4</text>
  <text x="540" y="316" text-anchor="middle" fill="#72809A" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="500">GB</text>
  <text x="540" y="424" text-anchor="middle" fill="#34415C" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="600">存储空间</text>

  <!-- 无标题 -->
  <g filter="url(#shadow)">
    <rect x="728" y="108" width="312" height="396" rx="22" fill="#FFFFFF" stroke="#E8ECF4"/>
  </g>
  <text x="756" y="142" fill="#8A96AA" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">无标题 · title = NULL</text>
  <circle cx="884" cy="282" r="92" fill="none" stroke="#E8ECF4" stroke-width="18"/>
  <circle cx="884" cy="282" r="92" fill="none" stroke="#4F6FF3" stroke-width="18" stroke-linecap="round" stroke-dasharray="168.892 603.186" transform="rotate(-90 884 282)"/>
  <text x="884" y="290" text-anchor="middle" fill="#17233C" font-family="Segoe UI, sans-serif" font-size="58" font-weight="650">28</text>
  <text x="884" y="316" text-anchor="middle" fill="#72809A" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="500">%</text>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <circle cx="52" cy="532" r="5" fill="#4F6FF3"/>
    <text x="65" y="537" fill="#5F6D84" font-size="12">进度色 #4F6FF3</text>
    <circle cx="198" cy="532" r="5" fill="#E8ECF4"/>
    <text x="211" y="537" fill="#5F6D84" font-size="12">轨道色 #E8ECF4</text>
    <rect x="340" y="523" width="30" height="18" rx="3" fill="#17233C"/>
    <text x="379" y="537" fill="#5F6D84" font-size="12">数值色 #17233C</text>
    <text x="700" y="537" fill="#5F6D84" font-size="12">建议尺寸 160×160，环宽 18</text>
  </g>
</svg>
